<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Task Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow centered column; header with date and tally, composer, filter tabs, task list, footer actions. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5d6b79;
  --line: #d6dce3;
  --accent: #1f5fd6;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --done: #2f8a5b;
  --focus: #1f5fd6;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171e;
    --surface: #1a222b;
    --fg: #e6ebf0;
    --muted: #93a1af;
    --line: #2b3641;
    --accent: #6a9bff;
    --accent-fg: #0b1220;
    --danger: #ff8a80;
    --done: #62c28f;
    --focus: #6a9bff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171e;
  --surface: #1a222b;
  --fg: #e6ebf0;
  --muted: #93a1af;
  --line: #2b3641;
  --accent: #6a9bff;
  --accent-fg: #0b1220;
  --danger: #ff8a80;
  --done: #62c28f;
  --focus: #6a9bff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.25rem;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.date {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 6px;
}
.tally { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tally strong { color: var(--fg); font-weight: 500; }

.composer { display: flex; gap: 8px; }
.composer input {
  flex: 1; min-width: 0;
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
}
.composer input::placeholder { color: var(--muted); }
button {
  font: inherit;
  cursor: pointer;
}
.add {
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  border-radius: 8px;
  padding: 0 18px;
  font-weight: 600;
}
.add:hover { filter: brightness(1.08); }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.composer input:focus-visible { outline-offset: 0; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0;
  padding: 8px 12px;
  color: var(--muted);
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }

ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
li label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; }
li input[type="checkbox"] {
  appearance: none;
  flex: none;
  width: 22px; height: 22px;
  margin: 0;
  border: 2px solid var(--muted);
  border-radius: 6px;
  display: grid; place-content: center;
  cursor: pointer;
  background: transparent;
}
li input[type="checkbox"]::after {
  content: "";
  width: 10px; height: 5px;
  border-left: 2.5px solid var(--accent-fg);
  border-bottom: 2.5px solid var(--accent-fg);
  transform: rotate(-45deg) translate(1px, -1px);
  opacity: 0;
}
li input[type="checkbox"]:checked { background: var(--done); border-color: var(--done); }
li input[type="checkbox"]:checked::after { opacity: 1; }
li .text { overflow-wrap: anywhere; }
li.done .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.del {
  flex: none;
  background: none; border: 0;
  color: var(--muted);
  width: 32px; height: 32px;
  border-radius: 6px;
  font-size: 1.25rem; line-height: 1;
}
.del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.125rem; margin-bottom: 4px; }

footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.875rem; color: var(--muted); }
.clear { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
.clear:hover { color: var(--danger); }
.clear[hidden] { display: none; }

@media (max-width: 420px) { h1 { font-size: 1.875rem; } }
@media (prefers-reduced-motion: no-preference) {
  li { animation: in 0.18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="wrap">
  <header>
    <div>
      <p class="date" id="date"></p>
      <h1>Task Ledger</h1>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>

  <form class="composer" id="form" autocomplete="off">
    <input id="newTask" type="text" placeholder="Add a task and press Enter" aria-label="New task" maxlength="200">
    <button class="add" type="submit">Add</button>
  </form>

  <div class="tabs" role="group" aria-label="Filter tasks">
    <button class="tab" data-filter="all" aria-pressed="true">All</button>
    <button class="tab" data-filter="active" aria-pressed="false">To do</button>
    <button class="tab" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="hint">Tick a task to complete it. Use × to delete it.</span>
    <button class="clear" id="clear" type="button" hidden>Clear completed</button>
  </footer>
</div>

<script>
(function () {
  var KEY = "task-ledger-v1";
  var tasks = [];
  var filter = "all";

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed; }
    } catch (e) {}
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  tasks = load() || [
    { id: uid(), text: "Reply to the vendor quote email", done: false },
    { id: uid(), text: "Book dentist appointment", done: false },
    { id: uid(), text: "Pay electricity bill", done: true }
  ];

  var listEl = document.getElementById("list");
  var tallyEl = document.getElementById("tally");
  var clearBtn = document.getElementById("clear");
  var input = document.getElementById("newTask");

  document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", day: "numeric", month: "long"
  });

  function render() {
    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    var doneCount = tasks.length - remaining;
    tallyEl.innerHTML = "<strong>" + remaining + "</strong> to do · <strong>" + doneCount + "</strong> done";
    clearBtn.hidden = doneCount === 0;

    var visible = tasks.filter(function (t) {
      return filter === "all" || (filter === "active" ? !t.done : t.done);
    });

    listEl.textContent = "";
    if (visible.length === 0) {
      var li = document.createElement("li");
      li.className = "empty";
      li.style.display = "block";
      var msg = tasks.length === 0 ? ["Nothing on the list", "Type a task above and press Enter."]
        : filter === "done" ? ["No completed tasks", "Tick a task to see it here."]
        : ["All caught up", "Every task is done."];
      li.innerHTML = "<strong></strong><span></span>";
      li.firstChild.textContent = msg[0];
      li.lastChild.textContent = msg[1];
      listEl.appendChild(li);
      return;
    }

    visible.forEach(function (t) {
      var li = document.createElement("li");
      if (t.done) li.className = "done";

      var label = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.addEventListener("change", function () { t.done = cb.checked; save(); render(); });
      var span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;
      label.appendChild(cb);
      label.appendChild(span);

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", "Delete task: " + t.text);
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        save(); render();
      });

      li.appendChild(label);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: uid(), text: text, done: false });
    input.value = "";
    if (filter === "done") setFilter("all");
    save(); render();
    input.focus();
  });

  function setFilter(f) {
    filter = f;
    document.querySelectorAll(".tab").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === f));
    });
  }
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { setFilter(b.getAttribute("data-filter")); render(); });
  });

  clearBtn.addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });

  render();
})();
</script>

</body></html>
